<!-- @dsCard group="Colors" viewport="700x160" name="Accent: mark peach + mauve" subtitle="Peach leads on the site; mauve stays the interaction color" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-ui)}body{padding:20px;box-sizing:border-box}.mono{font-family:var(--font-mono)}.lbl{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);line-height:1.6}.row{display:flex;gap:12px}.g{display:grid;grid-template-columns:1fr 1fr;gap:16px}.b{display:flex;gap:14px;align-items:center}.t{width:58px;height:58px;border-radius:14px;flex:none}</style></head><body>
<div class="g">
<div class="b"><div class="t" style="background:var(--accent)"></div><div class="lbl">--accent · mark peach<br>hsl(17 63% 61%)<br>buttons, links, section numbers<br>hover → hsl(23 92% 75%)</div></div>
<div class="b"><div class="t" style="background:var(--focus)"></div><div class="lbl">--focus · ctp-mauve<br>hsl(267 84% 81%)<br>focus rings, selection, active docs row<br>never a marketing surface</div></div>
</div></body></html>
