<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-ui)}body{padding:20px;box-sizing:border-box}.mono{font-family:var(--font-mono)}.lbl{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);line-height:1.6}.row{display:flex;gap:12px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.sw{height:56px;border:1px solid var(--hairline);border-radius:var(--r-card)}</style></head><body>
<div class="g">
<div><div class="sw" style="background:var(--page)"></div><div class="lbl">--page · ctp-mantle<br>240 21% 12%</div></div>
<div><div class="sw" style="background:var(--card)"></div><div class="lbl">--card · ctp-base<br>240 21% 15%</div></div>
<div><div class="sw" style="background:var(--well)"></div><div class="lbl">--well · ctp-crust<br>240 23% 9%</div></div>
</div></body></html>
