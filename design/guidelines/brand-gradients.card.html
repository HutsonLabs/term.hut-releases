<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-ui)}body{padding:20px;box-sizing:border-box}.mono{font-family:var(--font-mono)}.lbl{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);line-height:1.6}.row{display:flex;gap:12px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.b{height:80px;border-radius:var(--r-card);border:1px solid var(--hairline);display:flex;align-items:center;justify-content:center}</style></head><body>
<div class="g">
<div><div class="b" style="background:var(--grad-ground)"></div><div class="lbl">A · ground fade<br>mantle → crust, 180deg</div></div>
<div><div class="b" style="background:var(--grad-bloom),var(--page)"><img src="../assets/favicon.svg" alt="" width="30" height="30"></div><div class="lbl">B · hero bloom<br>peach 10%, radial, once per site</div></div>
<div><div class="b" style="border-color:transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad-card-edge) border-box;border:1px solid transparent"><span class="lbl">card edge</span></div><div class="lbl">C · card edge<br>overlay0 → surface0, greys only</div></div>
</div></body></html>
