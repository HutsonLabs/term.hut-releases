<!-- @dsCard group="Colors" viewport="700x150" name="Ink ramp" subtitle="ink → ink-muted → ink-soft → ink-dim; overlay1 is decoration only" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-ui)}body{padding:20px;box-sizing:border-box}.mono{font-family:var(--font-mono)}.lbl{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);line-height:1.6}.row{display:flex;gap:12px}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.sw{height:34px;border-radius:6px}</style></head><body>
<div class="g">
<div><div class="sw" style="background:var(--ink)"></div><div class="lbl">--ink<br>text · 226 64% 88%</div></div>
<div><div class="sw" style="background:var(--ink-muted)"></div><div class="lbl">--ink-muted<br>subtext1 · body</div></div>
<div><div class="sw" style="background:var(--ink-soft)"></div><div class="lbl">--ink-soft<br>subtext0 · asides</div></div>
<div><div class="sw" style="background:var(--ink-dim)"></div><div class="lbl">--ink-dim<br>overlay2 · labels</div></div>
<div><div class="sw" style="background:var(--ink-decor)"></div><div class="lbl">--ink-decor<br>overlay0 · no text</div></div>
</div></body></html>
