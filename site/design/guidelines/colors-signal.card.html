<!-- @dsCard group="Colors" viewport="700x130" name="Signal colors" subtitle="Meaning carried over from the app, unchanged" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-ui)}body{padding:20px;box-sizing:border-box}.mono{font-family:var(--font-mono)}.lbl{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);line-height:1.6}.row{display:flex;gap:12px}.r{display:flex;flex-wrap:wrap;gap:10px}.p{font-family:var(--font-mono);font-size:11px;padding:8px 12px;border-radius:8px}</style></head><body>
<div class="r">
<span class="p" style="background:hsl(115 54% 76% / .12);color:var(--ok);border:1px solid hsl(115 54% 76% / .3)">green · shipped, success</span>
<span class="p" style="background:hsl(41 86% 83% / .12);color:var(--warn);border:1px solid hsl(41 86% 83% / .3)">yellow · caveat, beta</span>
<span class="p" style="background:hsl(343 81% 75% / .12);color:var(--danger);border:1px solid hsl(343 81% 75% / .3)">red · breaking, removed</span>
<span class="p" style="background:hsl(217 92% 76% / .12);color:var(--info);border:1px solid hsl(217 92% 76% / .3)">blue · info, docs links</span>
<span class="p" style="background:hsl(170 57% 73% / .12);color:var(--remote);border:1px solid hsl(170 57% 73% / .3)">teal · SSH, remote</span>
</div></body></html>
