<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-ui)}body{padding:20px;box-sizing:border-box}.mono{font-family:var(--font-mono)}.lbl{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);line-height:1.6}.row{display:flex;gap:12px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.bx{height:52px;border-radius:var(--r-card);background:var(--card)}</style></head><body>
<div class="g">
<div><div class="bx" style="border:1px solid var(--hairline)"></div><div class="lbl">--hairline · surface1<br>card and section edges · 1.80:1</div></div>
<div><div class="bx" style="border:1px solid var(--hairline-strong)"></div><div class="lbl">--hairline-strong · overlay0<br>controls, inputs · 3.31:1</div></div>
<div><div class="bx" style="border:2px solid var(--focus)"></div><div class="lbl">focus · the border itself thickens<br>2px mauve, no offset ring</div></div>
</div></body></html>
