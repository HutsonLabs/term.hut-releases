<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}
.tile{width:1280px;height:854px;display:flex}
.main{flex:1;background:var(--page);display:flex;align-items:center;justify-content:center}
.main img{width:420px;height:420px;display:block}
.strip{width:320px;display:flex;flex-direction:column}
.strip span{flex:1;display:block}</style></head><body>
<div class="tile">
  <div class="main"><img src="assets/favicon.svg" alt="term.hut"></div>
  <div class="strip">
    <span style="background:var(--ctp-yellow)"></span>
    <span style="background:var(--ctp-mauve)"></span>
    <span style="background:var(--ctp-red)"></span>
    <span style="background:var(--accent)"></span>
  </div>
</div></body></html>
