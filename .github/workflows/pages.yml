name: Deploy site to GitHub Pages

# Publishes site/ by force-pushing it to the gh-pages branch, which is the
# repo's Pages source. The official deploy-pages route (configure-pages with
# enablement) is not usable here: the Actions GITHUB_TOKEN may not create the
# Pages site on this org repo ("Resource not accessible by integration").
# Pushing gh-pages needs only contents: write, and first pushing that branch
# is what enabled Pages on this public repo in the first place.

on:
  push:
    branches:
      - main
      # Lets the site deploy before this branch's PR merges; safe to drop after.
      - claude/rc-setup-questions-y5ewej
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

# One deploy at a time; never cancel a run mid-deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish site/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
